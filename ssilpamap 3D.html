<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>แผนผังวิทยาลัยสถาปนศิลป์ 3 มิติ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#e6d8b4;--ink:#3a2a1c;--mu:#7a6445;--ln:rgba(90,60,30,.45);--rd:#9a2a22;--card:#efe4c4;--fx:"Chonburi","FreeSerif","Noto Serif Thai",serif;--fb:"Noto Serif Thai","FreeSerif","Loma",serif;box-sizing:border-box}
:root.night{--paper:#2b241c;--ink:#eadcb8;--mu:#b7a27a;--ln:rgba(230,200,140,.35);--rd:#d4574a;--card:#3a3025}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:var(--fb);color:var(--ink);transition:background .6s}
body{background-image:radial-gradient(ellipse at 18% 12%,rgba(150,100,40,.14),transparent 38%),radial-gradient(ellipse at 85% 78%,rgba(120,80,30,.16),transparent 42%),radial-gradient(ellipse at 60% 30%,rgba(255,250,230,.25),transparent 50%)}
#stage{position:fixed;inset:0;touch-action:none}#cv,#ov{position:absolute;left:0;top:0;display:block}#ov{pointer-events:none}
#cv{filter:contrast(.97) sepia(.12)}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;pointer-events:auto;width:26px;height:26px;border-radius:50%;border:2px solid #f3ead0;background:#9a2a22;color:#f3ead0;font:700 13px/22px var(--fb);padding:0;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(40,20,5,.55),0 0 0 1px #6b1d17;will-change:transform}
.pin.sel{background:#c0392b;box-shadow:0 0 0 3px rgba(154,42,34,.35),0 1px 3px rgba(40,20,5,.55)}
#gr{position:fixed;inset:0;pointer-events:none;z-index:8;mix-blend-mode:multiply;opacity:.55;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#vg{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(70,42,14,.32) 100%)}
/* ---- old Thai book frame ---- */
#fr{position:fixed;inset:7px;pointer-events:none;z-index:9;border:20px solid transparent;border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect x='1.5' y='1.5' width='57' height='57' fill='none' stroke='%237a3b22' stroke-width='1.6'/><rect x='7' y='7' width='46' height='46' fill='none' stroke='%237a3b22' stroke-width='.8'/><path d='M30 11l7 19-7 19-7-19z' fill='none' stroke='%239a2a22' stroke-width='1.3'/><path d='M23 30h14' stroke='%239a2a22' stroke-width='1'/><circle cx='30' cy='30' r='2.4' fill='%239a2a22'/><circle cx='30' cy='4' r='1' fill='%237a3b22'/><circle cx='30' cy='56' r='1' fill='%237a3b22'/></svg>") 20 round}
.cn{position:fixed;z-index:10;width:78px;height:78px;pointer-events:none}.cn.a{left:2px;top:2px}.cn.b{right:2px;top:2px;transform:scaleX(-1)}.cn.c{left:2px;bottom:2px;transform:scaleY(-1)}.cn.d{right:2px;bottom:2px;transform:scale(-1,-1)}
.g{position:fixed;z-index:4;background:var(--card);border:1px solid var(--ln);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--ln),0 5px 14px rgba(50,28,8,.32)}
header{left:44px;top:calc(env(safe-area-inset-top,0px) + 44px);display:flex;gap:12px;align-items:center;padding:9px 18px 9px 10px}
header img{width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid var(--ln);padding:2px}
header small{display:block;font-size:11px;letter-spacing:.14em;color:var(--mu)}header b{display:block;font:400 19px/1.25 var(--fx);color:var(--rd)}header span{display:block;font-size:12px;color:var(--mu);border-top:1px solid var(--ln);margin-top:3px;padding-top:3px}
#cap{right:48px;left:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:3;max-width:300px;background:none;border:0;box-shadow:none;font-size:12px;line-height:1.5;color:var(--mu);font-style:italic;text-align:right}
#modes{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;padding:4px;gap:2px}
#modes button,.tb{border:0;background:none;color:var(--ink);font:600 14px var(--fb);padding:8px 16px;display:flex;gap:7px;align-items:center;cursor:pointer;border-right:1px dotted var(--ln)}#modes button:last-child{border:0}
#modes button.on{background:var(--rd);color:#f5ecd3}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tools{position:fixed;z-index:4;right:44px;top:calc(env(safe-area-inset-top,0px) + 44px);display:flex;flex-direction:column;gap:12px}
#tools .tb{position:static;padding:10px;border:1px solid var(--ln);background:var(--card);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--ln),0 4px 10px rgba(50,28,8,.3)}.tb.off{opacity:.5}
#panel{left:40px;right:40px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);max-height:40vh;overflow:auto;padding:14px 18px 16px;transform:translateY(170%);transition:transform .3s;z-index:5}#panel.on{transform:none}
#panel .n{float:left;width:40px;height:40px;border-radius:50%;background:var(--rd);color:#f5ecd3;display:grid;place-items:center;font:700 18px var(--fb);margin-right:12px;border:3px double #f3ead0;outline:1px solid var(--rd)}
#pt{font:400 20px/1.3 var(--fx);margin:0;color:var(--rd)}#ps{font-size:13px;color:var(--mu);font-weight:600;margin:2px 0 8px}
#pd{clear:both;font-size:15px;line-height:1.8;margin:8px 0 0;border-top:1px solid var(--ln);padding-top:8px;text-indent:1.6em}
#pf{font-size:14px;line-height:1.75;margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--rd);background:rgba(154,42,34,.07)}#pf b{color:var(--rd)}
#px{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mu);cursor:pointer;padding:6px}
#list{right:44px;top:calc(env(safe-area-inset-top,0px) + 96px);width:270px;max-height:58vh;overflow:auto;padding:6px;display:none;z-index:6}#list.on{display:block}
#list button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px dotted var(--ln);background:none;color:var(--ink);font:15px var(--fb);text-align:left;padding:8px;cursor:pointer}#list button:hover{background:var(--ln)}
#list i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--rd);color:#f5ecd3;display:grid;place-items:center;font:700 12px var(--fb)}
#err{position:fixed;left:60px;right:60px;top:40%;z-index:20;text-align:center;font-size:16px}
@media(min-width:700px){#panel{left:auto;right:44px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 44px);width:350px;max-height:72vh;transform:translateX(135%)}#tools{right:auto;left:44px;top:calc(env(safe-area-inset-top,0px) + 124px)}#list{right:auto;left:100px;top:calc(env(safe-area-inset-top,0px) + 124px)}}
@media(max-width:699px){header{left:30px;top:30px;padding:6px 12px 6px 8px}header img{width:38px;height:38px}header b{font-size:15px}header small,#cap{display:none}#tools{right:30px;top:30px;flex-direction:row}.cn{width:54px;height:54px}#modes{bottom:34px}#panel{left:30px;right:30px;bottom:90px}}
body.clean{background:#fff!important;background-image:none!important}body.clean #gr,body.clean #vg{display:none}body.clean #cv{filter:none}
body.shot #fr,body.shot .cn,body.shot header,body.shot #modes,body.shot #tools,body.shot #panel,body.shot #list,body.shot #cap,body.shot #vg{display:none}
</style></head><body>
